<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Mushroom Garden</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        #ar-button {
            background: #2196F3;
        }
        #ar-button:hover {
            background: #0b7dda;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h3 style="margin-top: 0;">Mushroom Garden 🍄</h3>
        <button onclick="window.location.href='vr-forest.html'" style="background: #9C27B0; margin-bottom: 10px; width: 100%;">🌲 VR Forest Scene (USDZ Models)</button>
        <button onclick="addRandomMushroom()">Add Random Mushroom</button>
        <button onclick="addMushroomCluster()">Add Cluster</button>
        <button onclick="clearMushrooms()">Clear All</button>
        <button id="ar-button" onclick="startAR()">Start AR Mode</button>
    </div>

    <div id="info">
        Click to add mushrooms | Drag to rotate view | Scroll to zoom
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="mushroom-ar.js"></script>
</body>
</html>

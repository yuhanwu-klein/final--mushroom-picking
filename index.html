<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Glass Landscape</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        #ar-button {
            background: #2196F3;
        }
        #ar-button:hover {
            background: #0b7dda;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
        }
        #video-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            border: 3px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            display: none;
        }
        #webcam-preview {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #hand-status {
            position: absolute;
            bottom: 60px;
            left: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="video-container">
        <video id="webcam-preview" autoplay playsinline></video>
        <canvas id="hand-canvas"></canvas>
    </div>
    <div id="hand-status">Hand Tracking: Active</div>

    <div id="controls">
        <h3 style="margin-top: 0;">AR Glass Landscape</h3>
        <button onclick="toggleLandscape()">Toggle Glass Landscape</button>
        <button onclick="toggleHandTracking()">Start Hand Tracking</button>
        <button onclick="addRandomMushroom()">Add Random Mushroom</button>
        <button onclick="addMushroomCluster()">Add Cluster</button>
        <button onclick="clearMushrooms()">Clear All</button>
        <button id="ar-button" onclick="startAR()">Start AR Mode</button>
    </div>

    <div id="info">
        Click to add mushrooms | Drag to rotate | Scroll to zoom | Use hand tracking to throw mushrooms!
    </div>

    <!-- MediaPipe Hands Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="mushroom-ar.js"></script>
</body>
</html>
